name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HUGO_VERSION: 0.155.1

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install Hugo
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - run: npm ci
      - run: npm ci --prefix demo
      - run: npm run build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: hugo -s docs -d "${{ github.workspace }}/_site" --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build hosted demo
        env:
          VITE_HOSTED_DEMO: 'true'
        run: npm --prefix demo run build -- --outDir "${{ github.workspace }}/_site/demo" --emptyOutDir

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
