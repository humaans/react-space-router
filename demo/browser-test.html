<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Space Router browser fixture</title>
    <style>
      html {
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
      }
      nav {
        position: fixed;
        z-index: 1;
        inset: 0 0 auto;
        display: flex;
        gap: 24px;
        padding: 16px;
        background: white;
        border-bottom: 1px solid #ddd;
      }
      main {
        min-height: 3200px;
        padding: 80px 24px 24px;
      }
      #anchor {
        margin-top: 1800px;
      }
      .guard-controls {
        position: fixed;
        z-index: 2;
        right: 16px;
        top: 17px;
      }
      .guard-dialog {
        position: fixed;
        z-index: 3;
        inset: 50% auto auto 50%;
        padding: 24px;
        background: white;
        border: 1px solid #888;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/browser-test.tsx"></script>
